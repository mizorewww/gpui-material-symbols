name: Release

# Publishes when a v<version> tag is pushed (upstream-land.yml pushes it after
# merging a Kit port; a maintainer may push one by hand). Each published crate
# whose version is not on crates.io yet is published, the data crates first, with
# the CARGO_REGISTRY_TOKEN secret; then a GitHub release is made from
# CHANGELOG.md, and gpui-kit-material's waiting port of the same Kit is started.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Verifying the root builds gpui-kit, which needs desktop libraries on Linux.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - name: Check the tag names the root version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "gpui-material-symbols") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match gpui-material-symbols $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in gpui-material-symbols-outlined gpui-material-symbols-rounded \
                       gpui-material-symbols-sharp gpui-material-symbols-supplemental \
                       gpui-material-symbols; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY release" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already published."
            else
              cargo publish --locked -p "$crate"
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Start gpui-kit-material's port
        env:
          GH_TOKEN: ${{ secrets.MAINTAINER_TOKEN }}
        run: |
          if gh api repos/mizorewww/gpui-kit-material/branches/renovate/gpui-kit --silent 2>/dev/null; then
            gh workflow run upstream-port.yml -R mizorewww/gpui-kit-material -f branch=renovate/gpui-kit
          fi
