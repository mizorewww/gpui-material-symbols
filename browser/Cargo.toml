[package]
name = "gpui-material-symbols-browser"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Material Symbols browser using the sibling Material components"
publish = false

[features]
default = ["material-browser"]
gpui-fast = ["gpui-kit/gpui-fast"]
# The former root feature now belongs to this consumer package. It embeds the
# catalog assets for offline native use; the separate web consumer loads them.
material-browser = ["gpui-material-symbols/embed-assets"]

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "main", features = ["test-support"] }
gpui-material-symbols = { path = "..", default-features = false }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", branch = "main" }
gpui-base = { version = "=0.8.1", features = ["test-support"] }
tiny-skia = { version = "0.11", features = ["png-format"] }
resvg = { version = "0.46", default-features = false }

[[bin]]
name = "material_symbols"
path = "src/main.rs"
required-features = ["material-browser"]
