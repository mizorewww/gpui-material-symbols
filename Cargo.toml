[package]
name = "gpui-material-symbols"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Complete variable Google Material Symbols as SVGs for Longbridge GPUI Kit"
repository = "https://github.com/mizorewww/gpui-material-symbols"
readme = "README.md"
# Git dependencies and ~52 MB of embedded assets cannot be published to crates.io.
publish = false
exclude = [".research/", "docs/", "scripts/", ".github/"]

[features]
default = ["gpui-kit"]
gpui-kit = ["dep:gpui-kit", "dep:anyhow"]
showcase = ["gpui-kit"]
material-browser = ["dep:gpui", "dep:gpui_platform", "dep:gpui-base", "dep:gpui-kit-material", "dep:image", "dep:tiny-skia"]

[dependencies]
ttf-parser = { version = "0.25", default-features = false, features = ["std", "variable-fonts"] }
anyhow = { version = "1", optional = true }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "main", optional = true }

# The Material example uses the exact same GPUI backend as Longbridge Kit.
# Keep these versions aligned with the sibling Material kit. For local sibling
# development, add a `[patch."https://github.com/mizorewww/gpui-kit-material"]` path override.
gpui = { package = "gpui-pre", version = "=0.3.10", optional = true, features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", optional = true, features = ["font-kit", "x11", "wayland", "runtime_shaders", "test-support"] }
gpui-base = { version = "=0.8.1", optional = true, features = ["test-support"] }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", branch = "main", optional = true }
image = { version = "0.25", default-features = false, optional = true }
tiny-skia = { version = "0.11", features = ["png-format"], optional = true }

[dev-dependencies]
roxmltree = "0.21"
resvg = { version = "0.46", default-features = false }

[profile.dev]
debug = "line-tables-only"

[[example]]
name = "export"
required-features = []

[[example]]
name = "showcase"
required-features = ["showcase"]

[[example]]
name = "material_symbols"
path = "examples/material_symbols/main.rs"
required-features = ["material-browser"]

[profile.dev.package.gpui-pre]
opt-level = 3
