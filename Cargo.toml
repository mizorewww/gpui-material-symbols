[workspace]
members = ["crates/*", "browser", "web"]
default-members = ["."]

[package]
name = "gpui-material-symbols"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Complete variable Google Material Symbols as SVGs for Longbridge GPUI Kit"
repository = "https://github.com/mizorewww/gpui-material-symbols"
homepage = "https://github.com/mizorewww/gpui-material-symbols"
documentation = "https://docs.rs/gpui-material-symbols"
readme = "README.md"
keywords = ["gpui", "material", "icons", "material-symbols", "svg"]
categories = ["gui", "graphics"]
include = [
    "/Cargo.toml",
    "/build.rs",
    "/src/",
    "/tests/",
    "/examples/",
    "/assets/",
    "/README.md",
    "/README.zh-CN.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[package.metadata.docs.rs]
# docs.rs has no GPU or display; the default features document the whole API.
all-features = false
features = ["gpui-kit", "embed-assets"]

[features]
default = ["gpui-kit", "embed-assets"]
# Build every font and the SVG pack into the binary (about 51 MB).
embed-assets = ["outlined", "rounded", "sharp", "supplemental"]
# Build one asset in. Assets left out can be supplied with `Asset::provide` at
# runtime (the web build downloads them).
outlined = ["dep:gpui-material-symbols-outlined"]
rounded = ["dep:gpui-material-symbols-rounded"]
sharp = ["dep:gpui-material-symbols-sharp"]
supplemental = ["dep:gpui-material-symbols-supplemental"]
gpui-kit = ["dep:gpui-kit", "dep:anyhow"]
showcase = ["gpui-kit"]
# Select the same engine for core, platforms and all Kit presentation layers.
gpui-fast = ["gpui-kit", "gpui-kit/gpui-fast"]
# Headless `showcase --capture`: enables test-support on Kit's own gpui-pre backend.
showcase-capture = ["showcase", "gpui-kit/test-support"]

[dependencies]
ttf-parser = { version = "0.25", default-features = false, features = ["std", "variable-fonts"] }
anyhow = { version = "1", optional = true }
gpui-kit = { version = "0.9", optional = true }
# The data crates hold exactly the files this version's catalog indexes.
gpui-material-symbols-outlined = { version = "=0.1.0", path = "crates/gpui-material-symbols-outlined", optional = true }
gpui-material-symbols-rounded = { version = "=0.1.0", path = "crates/gpui-material-symbols-rounded", optional = true }
gpui-material-symbols-sharp = { version = "=0.1.0", path = "crates/gpui-material-symbols-sharp", optional = true }
gpui-material-symbols-supplemental = { version = "=0.1.0", path = "crates/gpui-material-symbols-supplemental", optional = true }

[dev-dependencies]
roxmltree = "0.21"
resvg = { version = "0.46", default-features = false }

[profile.dev]
debug = "line-tables-only"

[[example]]
name = "export"
required-features = ["embed-assets"]

[[test]]
name = "integration"
required-features = ["gpui-kit", "embed-assets"]

[[test]]
name = "catalog"
required-features = ["embed-assets"]

[[test]]
name = "rendering"
required-features = ["embed-assets"]

[[example]]
name = "showcase"
required-features = ["showcase"]

[profile.dev.package.gpui-pre]
opt-level = 3

# The Material consumer shares its sibling's audited Kit/GPUI compatibility
# patches. Keep the two repositories adjacent for workspace development.
[patch."https://github.com/mizorewww/gpui-kit-material"]
gpui-kit-material = { path = "../gpui-kit-material/crates/material" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { path = "../gpui-kit-material/vendor/gpui-kit" }
gpui-base = { path = "../gpui-kit-material/vendor/gpui-base" }

# Workspace development only: the library itself builds against crates.io
# `gpui-kit` 0.9 without any patch. The browser and web consumers share the
# sibling's patched Kit, and both Kit sources must resolve to the same package.
[patch.crates-io]
# Material takes Symbols from crates.io; its consumers here use this checkout.
gpui-material-symbols = { path = "." }
gpui-kit = { path = "../gpui-kit-material/vendor/gpui-kit" }
gpui-fast-macos = { path = "../gpui-kit-material/vendor/gpui-fast-macos" }
gpui-pre-macos = { path = "../gpui-kit-material/vendor/gpui-pre-macos" }
gpui-fast = { path = "../gpui-kit-material/vendor/gpui-fast" }
gpui-fast-web = { path = "../gpui-kit-material/vendor/gpui-fast-web" }
gpui-fast-apple = { path = "../gpui-kit-material/vendor/gpui-fast-apple" }
gpui-base = { path = "../gpui-kit-material/vendor/gpui-base" }
gpui-pre = { path = "../gpui-kit-material/vendor/gpui-pre" }
gpui-pre-web = { path = "../gpui-kit-material/vendor/gpui-pre-web" }
gpui-pre-apple = { path = "../gpui-kit-material/vendor/gpui-pre-apple" }
