name: CI
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python3 scripts/sync_assets.py --verify
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features --features embed-assets
      - run: cargo test --locked --no-default-features
  gpui-kit-main:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked --test integration
      - run: cargo check --locked --features showcase --example showcase
      - run: cargo test --locked --no-default-features --features material-browser --example material_symbols
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
