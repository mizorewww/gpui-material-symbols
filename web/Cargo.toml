[package]
name = "gpui-material-symbols-web"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The Material Symbols browser example, built for the web"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The same versions as the root crate's `material-browser` feature.
[target.'cfg(target_family = "wasm")'.dependencies]
gpui-material-symbols = { path = "..", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", default-features = false }
gpui-base = { version = "=0.8.1" }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", branch = "main" }
tiny-skia = { version = "0.11", features = ["png-format"] }
resvg = { version = "0.46", default-features = false }
wasm-bindgen = "=0.2.129"

[lints.rust]
# The shared example checks the root crate's `gpui-kit` feature, absent here.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gpui-kit"))'] }
