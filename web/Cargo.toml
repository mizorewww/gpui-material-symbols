[package]
name = "gpui-material-symbols-web"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The Material Symbols browser example, built for the web"
publish = false

[features]
gpui-fast = ["gpui-kit/gpui-fast"]

[lib]
crate-type = ["cdylib", "rlib"]

# Engine and platform types both come from the Kit's selected backend.
[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit = "0.11.0"
gpui-material-symbols = { path = "..", default-features = false }
gpui-base = "0.11.0"
gpui-kit-material = { version = "0.3", default-features = false, features = ["full"] }
tiny-skia = { version = "0.11", features = ["png-format"] }
resvg = { version = "0.46", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
log = "0.4"
wasm-bindgen-futures = "0.4"

# Its own workspace, outside the root one: it follows the published gpui-kit-material,
# which can lag a Kit release the root library already supports.
[workspace]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

# Development only; the published library builds without any patch.
[patch.crates-io]
# Material takes Symbols from crates.io; this consumer uses this checkout.
gpui-material-symbols = { path = ".." }
# Published Kit 0.11.0 builds its Web platforms multithreaded, which needs a
# nightly toolchain and cross-origin isolation. gpui-kit-material's vendored Kit
# is the same 0.11.0 source with a manifest that keeps WASM single-threaded, so
# the web consumer builds on stable (gpui-kit-material docs/RELEASING.md).
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "dd1318612317b589edb45ceb56b0cd17fb9b5389" }
