[package]
name = "gpui-material-symbols-web"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The Material Symbols browser example, built for the web"
publish = false

[features]
gpui-fast = ["gpui-kit/gpui-fast"]

[lib]
crate-type = ["cdylib", "rlib"]

# Engine and platform types both come from the Kit's selected backend.
[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", branch = "main" }
gpui-material-symbols = { path = "..", default-features = false }
gpui-base = { version = "=0.8.1" }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", branch = "main", default-features = false }
tiny-skia = { version = "0.11", features = ["png-format"] }
resvg = { version = "0.46", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
log = "0.4"
wasm-bindgen-futures = "0.4"
