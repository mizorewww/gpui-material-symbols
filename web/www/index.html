<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Material Symbols</title>
    <meta name="description" content="Browse all 4,359 Google Material Symbols in GPUI, running in your browser through WebAssembly. Search, adjust the variable axes, export SVG or PNG, and copy the Rust code.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Material Symbols for GPUI">
    <meta property="og:description" content="The gpui-material-symbols icon browser, compiled to WebAssembly.">
    <meta property="og:url" content="https://m3symbols.mizore.blog/">
    <link rel="canonical" href="https://m3symbols.mizore.blog/">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="modulepreload" href="%JS%">
    <style>
      /* The browser's own canvas and ink colors, so the loading screen does
         not flash a different color before the first frame. */
      :root {
        color-scheme: light dark;
        --bg: #edf1f7; --fg: #202632; --muted: #626b7b;
        --surface: #ffffff; --primary: #3968d7; --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1e26; --fg: #e7eaf0; --muted: #a7afbf;
          --surface: #20242d; --primary: #8baffb; --on-primary: #16213a;
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body > canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #loading {
        position: fixed;
        z-index: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(360px, calc(100% - 32px));
        text-align: center;
        pointer-events: none;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border: 4px solid color-mix(in srgb, var(--fg) 12%, transparent);
        border-left-color: var(--fg);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
      .hint { margin-top: 4px; opacity: .7; font-size: 13px; }
      .bar {
        height: 4px;
        margin: 16px auto 0;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--primary) 20%, transparent);
      }
      .bar > div { height: 100%; width: 0; background: var(--primary); transition: width .2s; }
      .error { pointer-events: auto; }
      .error a { color: inherit; }
      /* A Material 3 basic dialog in the app's palette. */
      #star {
        margin: auto;
        width: min(400px, calc(100% - 32px));
        padding: 24px;
        border: 0;
        border-radius: 28px;
        background: var(--surface);
        color: var(--fg);
        box-shadow: 0 8px 24px rgb(0 0 0 / .2);
      }
      #star::backdrop { background: rgb(0 0 0 / .32); }
      #star h2 { margin-bottom: 16px; font-size: 24px; font-weight: 400; line-height: 32px; }
      #star p { color: var(--muted); }
      #star label { display: flex; gap: 12px; align-items: center; margin-top: 16px; cursor: pointer; }
      #star input { width: 18px; height: 18px; accent-color: var(--primary); }
      #star .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
      #star button, #star a.button {
        display: inline-flex;
        align-items: center;
        height: 40px;
        padding: 0 24px;
        border: 0;
        border-radius: 20px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        text-decoration: none;
        cursor: pointer;
      }
      #star button { background: none; color: var(--primary); }
      #star a.button { background: var(--primary); color: var(--on-primary); }
      #star button:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
      #star a.button:hover { background: color-mix(in srgb, var(--on-primary) 8%, var(--primary)); }
      #star :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="loading" role="status">
      <p id="loading-text">Loading Material Symbols…</p>
      <div class="bar" role="progressbar" aria-label="Download" aria-valuemin="0" aria-valuemax="100"><div></div></div>
      <p class="hint" id="loading-hint">About 8 MB on the first visit; later visits load from the cache.</p>
    </div>
    <dialog id="star" aria-labelledby="star-title" aria-describedby="star-text">
      <h2 id="star-title">Star on GitHub</h2>
      <p id="star-text">This icon browser is the example app of gpui-material-symbols, every Google Material Symbol for GPUI. A star helps others find it.</p>
      <label><input type="checkbox" id="star-never"> Don't show this again</label>
      <div class="actions">
        <button type="button" id="star-later" autofocus>Not now</button>
        <a class="button" id="star-go" href="https://github.com/mizorewww/gpui-material-symbols" target="_blank" rel="noopener">Star on GitHub</a>
      </div>
    </dialog>
    <noscript>This icon browser needs JavaScript and WebAssembly.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
